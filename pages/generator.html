
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LinkLite | URL Generator</title>
    <link rel="icon" type="image/png" href="../icon.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/generator.css">

    <script src="../js/validation.js" defer></script>
    <script src="../js/history.js" defer></script>
    <script src="../js/generator.js" defer></script>
</head>
<body>

    <!-- Navigation Bar -->
    <header class="site-header">
        <a href="../index.html" class="site-logo">
    <img src="../icon.png" alt="LinkLite Logo">
    <span>LINKLITE</span>
</a>

        <nav class="site-nav" aria-label="Main navigation">
            <a href="generator.html">Home</a>
            <a href="history.html">History</a>
         
        </nav>
    </header>

    <!-- URL Generator -->
    <main class="generator-container">
        <section class="generator-card">

          

            <h1>Make your links lighter.</h1>

            <p class="description">
                Paste your long URL below to get started.
            </p>

            <form id="urlForm" novalidate>
                <label for="originalUrl">Enter your long URL</label>

                <input
                    type="text"
                    id="originalUrl"
                    name="originalUrl"
                    placeholder="https://example.com/your-long-link"
                    autocomplete="url"
                    aria-describedby="formMessage"
                >

                <button type="submit" id="shortenBtn">
                    Validate URL
                </button>

                <p
                    id="formMessage"
                    class="form-message"
                    role="status"
                    aria-live="polite"
                ></p>
            </form>

            <a class="history-link" href="history.html">
                View link history
            </a>

        </section>
    </main>

</body>
</html>
